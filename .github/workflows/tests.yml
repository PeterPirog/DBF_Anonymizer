name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-pytest:
    name: Windows / Python ${{ matrix.python-version }} / full pytest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        shell: pwsh
        run: python -m compileall -q src tests
      - name: Full pytest
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -ra

  vfp-self-hosted:
    name: Visual FoxPro CDX integration
    if: ${{ vars.VFP_SELF_HOSTED == 'true' && vars.VFP_FIXTURE_PATH != '' }}
    runs-on: [self-hosted, Windows, vfp9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install -e ".[dev]"
      - name: VFP integration tests
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          DBF_ANONYMIZER_VFP_FIXTURE: ${{ vars.VFP_FIXTURE_PATH }}
        run: python -m pytest -ra -m vfp
