name: P0 package boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-wheel-boundary:
    name: Clean environment / pinned public dbfbridge 1.1+ acceptance artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Verify wheel metadata (identity + dbfbridge contract, no VCS URL)
        run: python tools/check_wheel_metadata.py dist/*.whl
      - name: Create clean venv and install the exact pinned public dbfbridge acceptance artifact
        run: |
          python -m venv clean-env
          clean-env/bin/python -m pip install --no-cache-dir --upgrade pip
          clean-env/bin/python -m pip install --no-cache-dir -r requirements/p0-dbfbridge-tested.txt
      - name: Install the built DBF_Anonymizer wheel without dependency resolution
        run: clean-env/bin/python -m pip install --no-cache-dir --no-deps dist/*.whl
      - name: pip check (wheel metadata vs installed environment)
        run: clean-env/bin/python -m pip check
      - name: Assert the installed dbfbridge is exactly the pinned acceptance artifact
        run: clean-env/bin/python tools/check_acceptance_pin.py
      - name: Install test tooling into the clean environment
        run: clean-env/bin/python -m pip install --no-cache-dir pytest
      - name: Prove dependency, capability, boundary and public-API contracts in the clean environment
        env:
          PYTHONUTF8: "1"
        run: |
          clean-env/bin/python -m pytest \
            tests/test_dependency_contract.py \
            tests/test_dbfbridge_capability_contract.py \
            tests/test_architecture_boundary.py \
            tests/test_root_public_api.py \
            tests/test_p1_public_models.py \
            -ra

  packaging-versions:
    name: REQ-P1-001/P1-002 packaging / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Verify wheel metadata and content
        run: python tools/check_wheel_metadata.py dist/*.whl
      - name: Clean install (pinned public dbfbridge + built wheel, no deps)
        run: |
          python -m venv clean-env
          clean-env/bin/python -m pip install --no-cache-dir --upgrade pip
          clean-env/bin/python -m pip install --no-cache-dir -r requirements/p0-dbfbridge-tested.txt
          clean-env/bin/python -m pip install --no-cache-dir --no-deps dist/*.whl
          clean-env/bin/python -m pip check
      - name: Prepare the external smoke root (outside GITHUB_WORKSPACE)
        env:
          SMOKE_ROOT: ${{ runner.temp }}/dbf-anonymizer-p1-${{ matrix.python-version }}
        run: |
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_ROOT/wheelhouse" "$SMOKE_ROOT/work"
          cp dist/*.whl "$SMOKE_ROOT/wheelhouse/"
          cp requirements/p0-dbfbridge-tested.txt "$SMOKE_ROOT/"
          echo "pin file copied verbatim:"
          cat "$SMOKE_ROOT/p0-dbfbridge-tested.txt"
      - name: Create the external venv and install (pinned public dbfbridge + built wheel)
        env:
          SMOKE_ROOT: ${{ runner.temp }}/dbf-anonymizer-p1-${{ matrix.python-version }}
        run: |
          python -m venv "$SMOKE_ROOT/venv"
          "$SMOKE_ROOT/venv/bin/python" -m pip install --no-cache-dir --upgrade pip
          "$SMOKE_ROOT/venv/bin/python" -m pip install --no-cache-dir -r "$SMOKE_ROOT/p0-dbfbridge-tested.txt"
          "$SMOKE_ROOT/venv/bin/python" -m pip install --no-cache-dir --no-deps "$SMOKE_ROOT"/wheelhouse/*.whl
          "$SMOKE_ROOT/venv/bin/python" -m pip check
      - name: Wheel runtime smoke from a directory objectively outside GITHUB_WORKSPACE
        env:
          SMOKE_ROOT: ${{ runner.temp }}/dbf-anonymizer-p1-${{ matrix.python-version }}
        run: |
          cd "$SMOKE_ROOT/work"
          case "$PWD" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
              echo "FAIL: smoke cwd $PWD is inside GITHUB_WORKSPACE" ; exit 1 ;;
            *) echo "smoke cwd (outside GITHUB_WORKSPACE): $PWD" ;;
          esac
          VENV_PY="$SMOKE_ROOT/venv/bin/python"
          VENV_CLI="$SMOKE_ROOT/venv/bin/dbf-anonymizer"
          "$VENV_PY" -c "import dbf_anonymizer; print('version:', dbf_anonymizer.__version__)"
          "$VENV_PY" -c "import dbf_anonymizer, sys; f = dbf_anonymizer.__file__; assert f.startswith('$SMOKE_ROOT'), f; assert 'site-packages' in f, f; assert not f.startswith('$GITHUB_WORKSPACE'), f; print('import origin:', f)"
          "$VENV_CLI" --help
          "$VENV_CLI" --version
      - name: Install pytest into the external smoke venv
        env:
          SMOKE_ROOT: ${{ runner.temp }}/dbf-anonymizer-p1-${{ matrix.python-version }}
        run: |
          "$SMOKE_ROOT/venv/bin/python" -m pip install --no-cache-dir pytest
      - name: Run focused P1-001/P1-002 contract tests against the installed wheel
        env:
          SMOKE_ROOT: ${{ runner.temp }}/dbf-anonymizer-p1-${{ matrix.python-version }}
        run: |
          "$SMOKE_ROOT/venv/bin/python" -m pytest \
            tests/test_p1_packaging.py \
            tests/test_p1_public_models.py \
            -ra

  tests:
    name: Remaining pytest suite / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Align the environment with the tested dbfbridge acceptance artifact
        run: python -m pip install -r requirements/p0-dbfbridge-tested.txt
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Strict typecheck
        run: python -m mypy --strict src/dbf_anonymizer
      - name: Pytest
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -ra
