name: P0 package boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-wheel-boundary:
    name: Clean environment / wheel resolves public dbfbridge 1.1+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Verify wheel metadata (identity + dbfbridge contract, no VCS URL)
        run: python tools/check_wheel_metadata.py dist/*.whl
      - name: Install built wheel into a clean environment
        # Dependency resolution happens ONLY against the public index; there
        # is no Git-URL fallback and no repository-checkout install.  If the
        # public dbfbridge 1.1+ distribution cannot be resolved this step
        # fails and is reported as an external dependency blocker.
        run: |
          python -m venv clean-env
          clean-env/bin/python -m pip install --no-cache-dir --upgrade pip
          clean-env/bin/python -m pip install --no-cache-dir dist/*.whl
      - name: Install test tooling into the clean environment
        run: clean-env/bin/python -m pip install --no-cache-dir pytest
      - name: Prove dbfbridge dependency and capability contracts in the clean environment
        env:
          PYTHONUTF8: "1"
        run: |
          clean-env/bin/python -m pytest \
            tests/test_dependency_contract.py \
            tests/test_dbfbridge_capability_contract.py \
            tests/test_architecture_boundary.py \
            tests/test_root_public_api.py \
            -ra

  tests:
    name: Remaining pytest suite / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Pytest
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -ra