[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbf-anonymizer"
version = "1.0.0.dev0"
description = "Privacy pseudonymization for Visual FoxPro DBF/FPT datasets with one protected reversible recovery vault."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PeterPirog" }]
dependencies = [
    "dbfbridge[write]>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]