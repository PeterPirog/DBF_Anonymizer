[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbf-anonymizer"
version = "1.0.0.dev0"
description = "Privacy pseudonymization for Visual FoxPro DBF/FPT datasets with one protected reversible recovery vault."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PeterPirog" }]
keywords = ["dbf", "foxpro", "pseudonymization", "privacy", "dbfbridge"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    "dbfbridge[write]>=1.1.0,<2",
]

[project.scripts]
dbf-anonymizer = "dbf_anonymizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]